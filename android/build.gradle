import groovy.xml.XmlParser

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects { project ->
    project.pluginManager.withPlugin("com.android.library") {
        def androidExt = project.extensions.findByName("android")
        if (androidExt != null && androidExt.namespace == null) {
            def manifestFile = project.file("src/main/AndroidManifest.xml")
            if (manifestFile.exists()) {
                def packageName = new XmlParser().parse(manifestFile).attribute("package")
                if (packageName != null) {
                    androidExt.namespace = packageName
                }
            }
        }
    }
    project.afterEvaluate {
        def androidExt = project.extensions.findByName("android")
        if (androidExt == null) {
            return
        }
        if (androidExt.namespace == null) {
            def manifestFile = project.file("src/main/AndroidManifest.xml")
            if (manifestFile.exists()) {
                def packageName = new XmlParser().parse(manifestFile).attribute("package")
                if (packageName != null) {
                    androidExt.namespace = packageName
                }
            }
        }
        androidExt.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
        androidExt.compileOptions.targetCompatibility = JavaVersion.VERSION_17
        try {
            androidExt.compileSdk = 36
        } catch (ignored) {
        }
        try {
            androidExt.kotlinOptions.jvmTarget = "17"
        } catch (ignored) {
        }
        if (project.name == "app") {
            androidExt.ndkVersion = "30.0.16248370"
        }
    }
    project.tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_17.toString()
        targetCompatibility = JavaVersion.VERSION_17.toString()
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
